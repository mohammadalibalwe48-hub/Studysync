name: studysync_syria_teachers
description: StudySync Syria Teachers — Flutter companion app for teachers to manage classes, view student progress, and curate content for the Physics/Chemistry student app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.0.0
  fl_chart: ^0.68.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.0
  supabase_flutter: ^2.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
