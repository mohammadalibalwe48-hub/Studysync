name: studysync_syria
description: StudySync Syria — a Flutter study app for Syrian 12th grade students preparing for physics and chemistry university entrance exams.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.0.0
  fl_chart: ^0.68.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.0
  supabase_flutter: ^2.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env

# Generated launcher icons. Run `dart run flutter_launcher_icons` after
# `bash tool/setup_android.sh` to (re)generate the Android mipmap PNGs from
# `assets/icon/app_icon.png`. `tool/setup_android.sh` invokes this for you.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: false
